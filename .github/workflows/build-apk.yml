name: Build APK

on:
  push:
    branches: [main, "vibe/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotspot-link-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to apk-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view apk-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create apk-latest --repo "$GITHUB_REPOSITORY" \
              --title "Hotspot Link APK (latest)" \
              --notes "Auto-built debug APK from commit ${GITHUB_SHA}. Install with 'Install unknown apps' enabled."
          fi
          gh release upload apk-latest app/build/outputs/apk/debug/app-debug.apk --clobber --repo "$GITHUB_REPOSITORY"
