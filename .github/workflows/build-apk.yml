name: Build APK

on:
  push:
    branches: [main, "vibe/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Install Android SDK components
        run: |
          SM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          if [ -z "$SM" ]; then
            echo "sdkmanager not found under $ANDROID_HOME" >&2
            ls -la "$ANDROID_HOME" >&2 || true
            exit 1
          fi
          yes | "$SM" --licenses
          "$SM" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotspot-link-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to apk-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if ! gh release view apk-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create apk-latest --repo "$GITHUB_REPOSITORY" \
                --title "Hotspot Link APK (latest)" \
                --notes "Auto-built debug APK from commit ${GITHUB_SHA}. Install with 'Install unknown apps' enabled." || true
            fi
            if gh release upload apk-latest app/build/outputs/apk/debug/app-debug.apk --clobber --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            echo "release upload attempt $attempt failed, retrying" >&2
            sleep 10
          done
          exit 1
